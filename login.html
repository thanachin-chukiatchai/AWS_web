<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chicago Crime Login</title>
<style>body{font-family:Arial,sans-serif;background:#f4f6f8;display:grid;place-items:center;min-height:100vh;margin:0}.card{background:#fff;padding:28px;border-radius:12px;box-shadow:0 4px 18px #0002;width:min(360px,90vw)}h1{margin-top:0;color:#e35205}label{display:block;margin:14px 0 6px}input,button{width:100%;padding:11px;border:1px solid #ccd3da;border-radius:6px;box-sizing:border-box}button{margin-top:20px;background:#e35205;color:#fff;border:0;font-weight:bold;cursor:pointer}#error{color:#b00020;margin-top:12px;min-height:20px}</style></head>
<body><main class="card"><h1>Chicago Crime</h1><p>เข้าสู่ระบบเพื่อใช้งาน</p><form id="login"><label>Username<input id="username" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>เข้าสู่ระบบ</button><div id="error"></div></form></main>
<script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const error=document.querySelector('#error');error.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'เข้าสู่ระบบไม่สำเร็จ');localStorage.setItem('crime_token',d.token);localStorage.setItem('crime_user',JSON.stringify(d.user));location.href=d.user.role==='commander'?'/dash.html':'/operation.html'}catch(err){error.textContent=err.message}});</script></body></html>
